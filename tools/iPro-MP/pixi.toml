[workspace]
authors = ["JoseFierroB <josefierrobustos@gmail.com>"]
channels = ["conda-forge", "pytorch"]
name = "iPro-MP"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[feature.ipro-mp.dependencies]
python = "3.10.*"
pip = ">=26.1.2,<27"
transformers = ">=4.29,<5"
numpy = "*"
biopython = "*"
pandas = "*"
scikit-learn = "*"
matplotlib = "*"
tokenizers = "*"

# torch via pip: conda channels (conda-forge/pytorch) ship CPU-only builds
# for >=2.9 (pytorch channel stops at 2.5.1). The default PyPI wheel is also
# CPU-only since 2.9 — CUDA wheels only on download.pytorch.org. cu128 wheels
# bundle CUDA 12.8 (driver >=570, compatible with RTX 5090 sm_120).
[feature.ipro-mp.pypi-dependencies]
torch = { version = ">=2.9,<2.12", index = "https://download.pytorch.org/whl/cu128" }

[environments]
ipro-mp = { features = ["ipro-mp"], no-default-feature = true }
