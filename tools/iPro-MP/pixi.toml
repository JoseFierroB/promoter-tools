[workspace]
authors = ["JoseFierroB <josefierrobustos@gmail.com>"]
channels = ["conda-forge", "pytorch"]
name = "iPro-MP"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[feature.ipro-mp.dependencies]
python = "3.10.*"
pip = ">=26.1.2,<27"
transformers = ">=4.29,<5"
numpy = "*"
biopython = "*"
pandas = "*"
scikit-learn = "*"
matplotlib = "*"
tokenizers = "*"

# torch via pip: conda channels (conda-forge/pytorch) ship CPU-only builds
# for >=2.9 (pytorch channel stops at 2.5.1). PyPI wheels bundle CUDA 12 —
# required for sm_120 (RTX 5090) support, which needs torch >= 2.9.
[feature.ipro-mp.pypi-dependencies]
torch = ">=2.9,<3"

[environments]
ipro-mp = { features = ["ipro-mp"], no-default-feature = true }
